  <style>
    :root {
      --bg: #2c1d08;
      --fg: #81fa99;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--bg);
      color: var(--fg);
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 3rem 1rem;
      text-align: center;
    }
    .logo { width: min(150px, 40vw); height: auto; display: block; }
    nav {
      display: flex;
      flex-direction: column;
      gap: 21px;  /* uma linha da grade */
      align-items: center;
      font-size: clamp(1rem, 2.6vw, 1.15rem);
      letter-spacing: 0.01em;
    }
    a {
      color: var(--fg);
      text-decoration: none;
      display: inline-block;
      outline: none;
      line-height: 21px;  /* cada linha = um tijolinho de altura */
      text-decoration-line: underline;
      text-decoration-color: transparent;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      transition: text-decoration-color .2s;
    }
    a:focus-visible { outline: 1px dashed var(--fg); outline-offset: 6px; }
    #bg {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
    }
    main, nav { position: relative; z-index: 1; }
    /* modo "placa": links numa faixa marrom e logo com contorno marrom */
    [data-mode="placa"] nav a { background: var(--bg); box-shadow: 0 0 0 12px var(--bg); }
    [data-mode="placa"] .logo {
      filter: drop-shadow(3px 0 0 var(--bg)) drop-shadow(-3px 0 0 var(--bg))
              drop-shadow(0 3px 0 var(--bg)) drop-shadow(0 -3px 0 var(--bg));
    }
    nav a { text-align: center; }
    main, nav { width: 100%; display: flex; flex-direction: column; align-items: center; }
    nav a:hover, nav a:focus-visible { text-decoration-color: var(--fg); }
  </style>
</head>

      var zone = { l: 0, r: 0, t: 0, b: 0, cx: 0, cy: 0, rad: 0 };
      function inRect(x, y) { return x >= zone.l && x <= zone.r && y >= zone.t && y <= zone.b; }
      function inCircle(x, y) { var dx = x - zone.cx, dy = y - zone.cy; return dx * dx + dy * dy <= zone.rad * zone.rad; }
      var TW = 12, TH = 21;     // tamanho do tijolinho (igual às letras)
      var GAP = 1;              // fresta entre tijolinhos pintados
      var FATIGUE = 0.38, RECOVER = 0.12;
      var CHANCE = 0.4;         // 40% dos tijolinhos reagem
      var MODE = (location.hash.slice(1) || 'livre'); // livre | apagado | placa
      document.documentElement.dataset.mode = MODE;
      var protectedCells = new Set(); // células atrás do logo e dos links
      var LANDED = 0.7;         // opacidade depois de aterrissar
      var FADE = 60;            // segundos até sumir de vez
      var lastCell = -1, lucky = false;
      var W, H, cols, rows, dpr;
      var tiles = new Map();    // tijolinhos em movimento
      var painted = new Map();  // "c,r" -> { cor, quando aterrissou }
      var mx = null, my = null;
      function cellRect(g, c, r) { g.fillRect(c * TW + GAP / 2, r * TH + GAP / 2, TW - GAP, TH - GAP); }
      function resize() {
        dpr = window.devicePixelRatio || 1;
        // a janela pode ter tamanho 0 (prévia escondida, aba carregando): nunca deixa a tela zerada
        W = Math.max(1, innerWidth || document.documentElement.clientWidth || 0);
        H = Math.max(1, innerHeight || document.documentElement.clientHeight || 0);
        [cv].forEach(function (k) { k.width = Math.max(1, Math.round(W * dpr)); k.height = Math.max(1, Math.round(H * dpr)); });
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cols = Math.ceil(W / TW); rows = Math.ceil(H / TH);
        tiles.clear();
      }
      resize(); addEventListener('resize', resize);
      addEventListener('mousemove', function (e) { mx = e.clientX; my = e.clientY; });
      document.addEventListener('mouseleave', function () { mx = my = null; });
      function rnd(a, b) { return a + Math.random() * (b - a); }
      function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
      var ZERO = { x: 0, y: 0, r: 0, a: 0 };
      var REST = { x: 0, y: 0, r: 0, a: LANDED };
      // bem devagar: segura um pouco e vai apagando suave
      function fadeAlpha(pt, now) {
        var k = Math.min(1, (now - pt.t) / (FADE * 1000));
        return LANDED * (1 - k * k * (3 - 2 * k));
      }
      function backTime(a) { // quanto tempo de fade já "passou" para estar nessa opacidade
        var lo = 0, hi = FADE * 1000;
        for (var i = 0; i < 20; i++) { var m = (lo + hi) / 2; if (fadeAlpha({ t: 0 }, m) > a) lo = m; else hi = m; }
        return lo;
      }
      function get(c, r) {
        var k = r * cols + c, t = tiles.get(k);
        if (!t) {
          var id = c + ',' + r, pt = painted.get(id), col = null, base = ZERO;
          if (pt) { // estava pintado: volta a se mexer a partir da opacidade atual
            col = pt.color;
            base = { x: 0, y: 0, r: 0, a: fadeAlpha(pt, performance.now()) };
            painted.delete(id);
          }
          t = { c: c, r: r, color: col, sens: 1, next: 0, from: base, to: base, t0: 0, dur: 1, cur: base };
          tiles.set(k, t);
        }
        return t;
      }
      var last = performance.now();
      function frame(now) {
        var dt = Math.min(0.1, (now - last) / 1000); last = now;
        // só o quadradinho embaixo do mouse, e só 40% das vezes
        var cur = -1;
        if (mx !== null) {
          var cc = Math.floor(mx / TW), rr = Math.floor(my / TH);
          if (cc >= 0 && cc < cols && rr >= 0 && rr < rows) {
            var key = rr * cols + cc;
            if (key !== lastCell) {
              lastCell = key;
              var px = cc * TW + TW / 2, py = rr * TH + TH / 2;
              lucky = Math.random() < CHANCE * (inRect(px, py) ? CENTER_CHANCE : 1);
            }
            if (lucky && !(MODE === 'livre' && protectedCells.has(cc + ',' + rr))) { get(cc, rr); cur = key; }
          }
        } else lastCell = -1;
        ctx.clearRect(0, 0, W, H);
        if (innerWidth !== W && innerWidth > 0 || innerHeight !== H && innerHeight > 0) resize();
        painted.forEach(function (pt, id) {
          var a = fadeAlpha(pt, now);
          if (a <= 0.004) { painted.delete(id); return; }
          var c = id.split(',');
          if (MODE === 'apagado' && protectedCells.has(id)) a *= 0.15;
          ctx.globalAlpha = a; ctx.fillStyle = pt.color; cellRect(ctx, +c[0], +c[1]);
        });
        ctx.globalAlpha = 1;
        tiles.forEach(function (t, k) {
          var cx = t.c * TW + TW / 2, cy = t.r * TH + TH / 2, inf = (k === cur) ? 1 : 0;
          if (inf > 0) t.sens = Math.max(0, t.sens - dt * FATIGUE * rnd(0.4, 1.6));
          else t.sens = Math.min(1, t.sens + dt * RECOVER);
          var amp = inf * t.sens;
          var p = Math.min(1, (now - t.t0) / (t.dur * 1000)), e = ease(p);
          t.cur = {
            x: t.from.x + (t.to.x - t.from.x) * e,
            y: t.from.y + (t.to.y - t.from.y) * e,
            r: t.from.r + (t.to.r - t.from.r) * e,
            a: t.from.a + (t.to.a - t.from.a) * Math.min(1, p * 3.5)
          };
          var rest = t.color ? REST : ZERO;
          if (now >= t.next) {
            t.from = t.cur; t.t0 = now;
            if (amp < 0.04) {
              t.to = rest; t.dur = rnd(1.4, 2.4); t.next = now + t.dur * 1000;
            } else {
              if (!t.color) { // revelado: ganha uma cor
                var greenish = inCircle(cx, cy) && Math.random() < CIRCLE_GREEN;
                var pool = greenish ? GREENS : PALETTE;
                t.color = pool[Math.floor(Math.random() * pool.length)];
              }
              var q = Math.random();
              var rise = amp * (Math.pow(q, 2.5) * 44 + rnd(0, 6));
              if (Math.random() < 0.15) rise = -amp * rnd(0, 8);
              t.to = {
                x: amp * rnd(-9, 9), y: -rise,
                r: amp * rnd(-1, 1) * (Math.random() < 0.25 ? 200 : 70) * Math.PI / 180,
                a: 1
              };
              t.dur = rnd(0.9, 1.9);
              t.next = now + t.dur * 1000 * rnd(0.5, 0.95);
            }
          }
          var s = t.cur;
          var settled = t.to === rest && p >= 1 && amp === 0 && t.sens >= 1;
          if (settled) {
            if (t.color && t.cur.a > 0.004) {
              // aterrissou: começa a apagar a partir da opacidade em que está
              var startA = Math.min(LANDED, t.cur.a);
              painted.set(t.c + ',' + t.r, { color: t.color, t: now - backTime(startA) });
            }
            tiles.delete(k); // descansou: vai para o fundo e começa a sumir
            return;
          }
          if (s.a > 0.01 && t.color) {
            ctx.save();
            ctx.globalAlpha = s.a;
            ctx.fillStyle = t.color;
            ctx.translate(cx + s.x, cy + s.y);
            ctx.rotate(s.r);
            ctx.fillRect(-TW / 2 + GAP / 2, -TH / 2 + GAP / 2, TW - GAP, TH - GAP);
            ctx.restore();
          }
        });
        requestAnimationFrame(frame);
      }
      // alinha cada link às linhas e colunas da grade de tijolinhos
      var links = Array.prototype.slice.call(document.querySelectorAll('nav a'));
      function snap() {
        links.forEach(function (a) { a.style.transform = ''; });
        links.forEach(function (a) {
          var r = a.getBoundingClientRect();
          var dy = Math.round(r.top / TH) * TH - r.top;
          a.style.transform = 'translateY(' + dy + 'px)'; // só nas linhas; na horizontal fica centralizado
        });
        // marca as células atrás do logo e dos links (com 1 tijolinho de folga)
        protectedCells.clear();
        // retângulo do meio (em volta do logo e dos links) e o círculo que o envolve
        var all = links.map(function (a) { return a.getBoundingClientRect(); });
        var lg = document.querySelector('.logo'); if (lg) all.push(lg.getBoundingClientRect());
        var L = Math.min.apply(null, all.map(function (b) { return b.left; }));
        var R = Math.max.apply(null, all.map(function (b) { return b.right; }));
        var T = Math.min.apply(null, all.map(function (b) { return b.top; }));
        var B = Math.max.apply(null, all.map(function (b) { return b.bottom; }));
        zone.l = L - 6 * TW; zone.r = R + 6 * TW; zone.t = T - 2 * TH; zone.b = B + 4 * TH;
        zone.cx = (zone.l + zone.r) / 2; zone.cy = (zone.t + zone.b) / 2;
        zone.rad = Math.hypot(zone.r - zone.l, zone.b - zone.t) / 2;
        var boxes = links.map(function (a) { return a.getBoundingClientRect(); });
        var logo = document.querySelector('.logo');
        if (logo) boxes.push(logo.getBoundingClientRect());
        boxes.forEach(function (b) {
          var c0 = Math.floor(b.left / TW) - 1, c1 = Math.floor((b.right - 1) / TW) + 1;
          var r0 = Math.floor(b.top / TH), r1 = Math.floor((b.bottom - 1) / TH);
          if (b === boxes[boxes.length - 1] && logo) { r0 -= 1; r1 += 1; }
          for (var r = r0; r <= r1; r++) for (var c = c0; c <= c1; c++) protectedCells.add(c + ',' + r);
        });
      }
      snap(); addEventListener('resize', snap); addEventListener('load', snap);
      if (document.fonts) document.fonts.ready.then(snap);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
